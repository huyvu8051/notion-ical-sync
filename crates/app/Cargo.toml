[package]
name = "app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
ssr = ["leptos/ssr", "dep:leptos_axum", "dep:any_spawner", "dep:axum", "dep:axum-oidc", "dep:sqlx", "dep:reqwest", "dep:chrono", "dep:tower-sessions", "dep:argon2", "dep:rand"]
hydrate = ["leptos/hydrate"]

[dependencies]
leptos = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false }
leptos_meta = "0.8"
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", optional = true, default-features = false }
axum-oidc = { version = "=1.0.0-dev-2", optional = true }
sqlx = { version = "0.8", optional = true, default-features = false, features = ["postgres", "runtime-tokio", "chrono"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json"] }
chrono = { version = "0.4", optional = true }
tower-sessions = { version = "0.15", optional = true }
any_spawner = { version = "0.3", optional = true }
argon2 = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "HtmlDocument"] }
