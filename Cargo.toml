[package]
name = "notion-ical-sync"
version = "0.2.0"
edition = "2021"

[dependencies]
dav-server = { version = "0.11", features = ["caldav", "hyper", "memfs"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
icalendar = { version = "0.17", features = ["parser"] }
futures-util = "0.3"
url = "2"
bytes = "1"
http = "1"
parking_lot = "0.12"
dyn-clone = "1"
axum = "0.8.9"
base64_light = "0.1.6"
leptos = { version = "0.8", features = ["ssr"] }
hmac = "0.12"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "chrono"] }
axum-oidc = "=1.0.0-dev-2"
tower-sessions = "0.15"
rand = "0.8"
# Pinned to a specific commit rather than the published 0.15.0: that crates.io
# release still depends on tower-sessions-core 0.14, which conflicts with our
# tower-sessions 0.15 (two different SessionStore trait definitions, doesn't
# compile). This commit has the fix (core bumped to 0.15) merged but not yet
# published as a new version.
tower-sessions-sqlx-store = { git = "https://github.com/maxcountryman/tower-sessions-stores", rev = "be0f230fadb4", features = ["postgres"] }
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
# rustls (not native-tls) to match reqwest's rustls-tls choice above — avoids
# pulling in a second TLS stack (openssl) as a transitive dependency.
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }
