name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Which images actually need rebuilding.
  #
  # Every push used to rebuild both, which meant a change to a mock -- code
  # that is not in the production binary at all -- still produced and pushed a
  # new production image. Since production runs :latest with
  # imagePullPolicy: Always, that is a production deployment triggered by
  # staging-only work. It is why the mock and metrics work had to live on
  # branches with their own image tags.
  #
  # The split is clean because the three mock binaries are standalone: they
  # have zero references to this crate's lib (verified, not assumed), so
  # nothing under src/bin/mock_*.rs can reach the production binary. Shared
  # inputs -- the manifest, the lockfile, the Dockerfile -- rebuild both,
  # since either image could change meaning from any of them.
  changes:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      mock: ${{ steps.filter.outputs.mock }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
            app:
              - *shared
              - 'src/**'
              # Negations come last and win: the mock binaries live under
              # src/ but are not linked into the production image.
              - '!src/bin/mock_notion.rs'
              - '!src/bin/mock_resend.rs'
              - '!src/bin/mock_paddle.rs'
              - 'crates/**'
              - 'migrations/**'
              - 'static/**'
              - 'tailwind/**'
            mock:
              - *shared
              - 'src/bin/mock_notion.rs'
              - 'src/bin/mock_resend.rs'
              - 'src/bin/mock_paddle.rs'

  build-and-push:
    name: Build & Push Docker
    needs: changes
    # workflow_dispatch forces a build: it is the escape hatch for "rebuild it
    # anyway", and there is no previous commit to diff against in that case.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Explicit, not implicit -- Docker builds the Dockerfile's LAST
          # stage when --target is unset, and the `mock` stage is now last.
          # Without this, a push would quietly ship mock_notion as :latest
          # instead of the real app.
          target: runtime
          push: true
          tags: ghcr.io/huyvu8051/notion-ical-sync:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-mock:
    name: Build & Push mock image
    needs: changes
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.mock == 'true')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mock image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: mock
          push: true
          tags: ghcr.io/huyvu8051/notion-ical-sync-mock:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Branch builds of the mock image only.
  #
  # The job above is pinned to main because a push there rebuilds and ships
  # the production image, and production pulls :latest with
  # imagePullPolicy: Always. Work on the mock -- which exists purely for the
  # staging environment and is not part of the production binary -- should not
  # have to wait behind that, nor drag unrelated commits into production to
  # get an image built.
  #
  # Tagged with the branch name, so staging can point at exactly this build
  # (see argocd/manifests/notion-caldav-saas-stg/mocks.yaml in the infra repo)
  # and :latest keeps meaning "what is on main".
  #
  # Triggered by hand, not by pushing: the `push` filter at the top of this
  # file only matches main, so a branch push starts no workflow at all and an
  # event_name condition here would never be evaluated. Run it with
  #   gh workflow run ci.yml --ref <branch>
  build-mock-branch:
    name: Build & Push mock image (branch)
    needs: changes
    if: >-
      github.ref != 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.mock == 'true')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mock image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: mock
          push: true
          tags: ghcr.io/huyvu8051/notion-ical-sync-mock:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Branch builds of the application image.
  #
  # Same reasoning as the mock job above: the main build ships production,
  # which pulls :latest with imagePullPolicy: Always, so application changes
  # that only staging should run yet need a tag of their own. Staging's
  # Deployment points at this tag explicitly (see
  # argocd/manifests/notion-caldav-saas-stg/deployment.yaml in the infra repo)
  # and :latest keeps meaning "what is on main".
  #
  # Triggered by hand for the same reason: the push filter at the top of this
  # file only matches main.
  #   gh workflow run ci.yml --ref <branch>
  build-app-branch:
    name: Build & Push app image (branch)
    needs: changes
    if: >-
      github.ref != 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: ghcr.io/huyvu8051/notion-ical-sync:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
