[package]
name = "app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
ssr = ["leptos/ssr", "dep:leptos_axum", "dep:any_spawner", "dep:axum", "dep:axum-oidc"]
hydrate = ["leptos/hydrate"]

[dependencies]
leptos = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false }
leptos_meta = "0.8"
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", optional = true, default-features = false }
axum-oidc = { version = "=1.0.0-dev-2", optional = true }
# render_app_to_stream needs a global reactive-graph executor. The pages
# still on the old per-handler render_app_to_stream pattern (not yet
# migrated into the single App/LeptosRoutes tree) need the host to call
# `app::init_executor()` once at startup — omitting it panics on the first
# request ("tried to spawn a Future ... before a global executor was
# initialized"), caught by running this locally against real Postgres/Keycloak.
# futures-executor: only used by sync_log's #[cfg(test)] render smoke tests
# (init_futures_executor) — a lighter single-thread executor than pulling in
# a tokio runtime just to satisfy Leptos's reactive-owner requirement in a
# plain #[test] fn. The host binary's own init_executor() (see below) still
# uses init_tokio for the real server.
any_spawner = { version = "0.3", optional = true, features = ["futures-executor"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
# Page data (e.g. SyncLogPageData) crosses the SSR/hydrate boundary as a JSON
# blob embedded in the SSR'd HTML — the server serializes it once, the client
# bootstrap script reads it back and re-mounts the identical component tree
# with it (see SyncLogShell). Needed unconditionally: the ssr build encodes,
# the hydrate build decodes.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "HtmlDocument"] }
