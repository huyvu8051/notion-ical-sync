name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Explicit, not implicit -- Docker builds the Dockerfile's LAST
          # stage when --target is unset, and the `mock` stage added below
          # is now last. Without this, the next push would have quietly
          # shipped mock_notion as :latest instead of the real app.
          target: runtime
          push: true
          tags: ghcr.io/huyvu8051/notion-ical-sync:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push mock_notion (staging only, see Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: mock
          push: true
          tags: ghcr.io/huyvu8051/notion-ical-sync-mock:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Branch builds of the mock image only.
  #
  # The job above is pinned to main because a push there rebuilds and ships
  # the production image, and production pulls :latest with
  # imagePullPolicy: Always. Work on the mock -- which exists purely for the
  # staging environment and is not part of the production binary -- should not
  # have to wait behind that, nor drag unrelated commits into production to
  # get an image built.
  #
  # Tagged with the branch name, so staging can point at exactly this build
  # (see argocd/manifests/notion-caldav-saas-stg/mocks.yaml in the infra repo)
  # and :latest keeps meaning "what is on main".
  build-mock-branch:
    name: Build & Push mock image (branch)
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mock image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: mock
          push: true
          tags: ghcr.io/huyvu8051/notion-ical-sync-mock:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
